$mod = SUPER
$terminal = alacritty
$menu = rofi -show drun

monitor = , preferred, auto, 1

env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24

input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }

    sensitivity = 0
}

general {
    layout = dwindle
    border_size = 0
    gaps_in = 0
    gaps_out = 0
}

decoration {
    rounding = 6
}

animations {
    enabled = true
}

misc {
    disable_hyprland_logo = true
}

exec-once = hyprpaper
exec-once = [workspace 1 silent] alacritty
exec-once = [workspace 2 silent] firefox
exec-once = [workspace 3 silent] code
exec-once = waybar -c ~/.config/waybar/config -s ~/.config/waybar/style.css > ~/.cache/waybar.log 2>&1

bind = $mod, RETURN, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen
bind = $mod SHIFT, B, exec, pkill -SIGUSR1 waybar

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Workspace switching: Super+N to switch, Super+Shift+N to move focused window
bind = $mod, 1, exec, hyprctl dispatch workspace 1
bind = $mod SHIFT, 1, exec, hyprctl dispatch movetoworkspace 1
bind = $mod, 2, exec, hyprctl dispatch workspace 2
bind = $mod SHIFT, 2, exec, hyprctl dispatch movetoworkspace 2
bind = $mod, 3, exec, hyprctl dispatch workspace 3
bind = $mod SHIFT, 3, exec, hyprctl dispatch movetoworkspace 3
bind = $mod, 4, exec, hyprctl dispatch workspace 4
bind = $mod SHIFT, 4, exec, hyprctl dispatch movetoworkspace 4
bind = $mod, 5, exec, hyprctl dispatch workspace 5
bind = $mod SHIFT, 5, exec, hyprctl dispatch movetoworkspace 5
bind = $mod, 6, exec, hyprctl dispatch workspace 6
bind = $mod SHIFT, 6, exec, hyprctl dispatch movetoworkspace 6
bind = $mod, 7, exec, hyprctl dispatch workspace 7
bind = $mod SHIFT, 7, exec, hyprctl dispatch movetoworkspace 7
bind = $mod, 8, exec, hyprctl dispatch workspace 8
bind = $mod SHIFT, 8, exec, hyprctl dispatch movetoworkspace 8
bind = $mod, 9, exec, hyprctl dispatch workspace 9
bind = $mod SHIFT, 9, exec, hyprctl dispatch movetoworkspace 9

# Next / previous workspace
bind = $mod, PAGEUP, exec, hyprctl dispatch workspace next
bind = $mod, PAGEDOWN, exec, hyprctl dispatch workspace prev

# Move current workspace between monitors
bind = $mod CTRL ALT, left, exec, hyprctl dispatch movecurrentworkspacetomonitor -1
bind = $mod CTRL ALT, right, exec, hyprctl dispatch movecurrentworkspacetomonitor +1

# Move active window to previous / next workspace
bind = $mod CTRL SHIFT, left, exec, hyprctl dispatch movetoworkspace -1
bind = $mod CTRL SHIFT, right, exec, hyprctl dispatch movetoworkspace +1
bind = $mod CTRL SHIFT, up, exec, hyprctl dispatch movetoworkspace -1
bind = $mod CTRL SHIFT, down, exec, hyprctl dispatch movetoworkspace +1

# Workspace switching: Super+N to switch, Super+Shift+N to move focused window
bind = $mod, 1, exec, hyprctl dispatch workspace 1
bind = $mod SHIFT, 1, exec, hyprctl dispatch movetoworkspace 1
bind = $mod, 2, exec, hyprctl dispatch workspace 2
bind = $mod SHIFT, 2, exec, hyprctl dispatch movetoworkspace 2
bind = $mod, 3, exec, hyprctl dispatch workspace 3
bind = $mod SHIFT, 3, exec, hyprctl dispatch movetoworkspace 3
bind = $mod, 4, exec, hyprctl dispatch workspace 4
bind = $mod SHIFT, 4, exec, hyprctl dispatch movetoworkspace 4
bind = $mod, 5, exec, hyprctl dispatch workspace 5
bind = $mod SHIFT, 5, exec, hyprctl dispatch movetoworkspace 5
bind = $mod, 6, exec, hyprctl dispatch workspace 6
bind = $mod SHIFT, 6, exec, hyprctl dispatch movetoworkspace 6
bind = $mod, 7, exec, hyprctl dispatch workspace 7
bind = $mod SHIFT, 7, exec, hyprctl dispatch movetoworkspace 7
bind = $mod, 8, exec, hyprctl dispatch workspace 8
bind = $mod SHIFT, 8, exec, hyprctl dispatch movetoworkspace 8
bind = $mod, 9, exec, hyprctl dispatch workspace 9
bind = $mod SHIFT, 9, exec, hyprctl dispatch movetoworkspace 9

# Next / previous workspace
bind = $mod, PAGEUP, exec, hyprctl dispatch workspace next
bind = $mod, PAGEDOWN, exec, hyprctl dispatch workspace prev

bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioStop, exec, playerctl stop
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
